<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>12th Papers KVD</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #2b2b2b;
      position: fixed;
      background: #fff8cc;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #fff8cc;
      z-index: 0;
    }

    /* Background Decorations */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 200, 0.5);
      filter: blur(40px);
      z-index: 0;
    }

    .bg-circle.one {
      width: 320px;
      height: 320px;
      top: -60px;
      left: -40px;
    }

    .bg-circle.two {
      width: 260px;
      height: 260px;
      bottom: -40px;
      right: -40px;
      background: rgba(255, 230, 150, 0.55);
    }

    .bg-stripes {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        135deg,
        rgba(255, 255, 230, 0.5) 0%,
        rgba(255,255,255,0.4) 20%,
        transparent 20%
      );
      background-size: 25px 25px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    canvas#stars {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* Floating Icons */
    .icon {
      position: absolute;
      color: #555;
      opacity: 0.3;
      animation: floatIcon linear infinite;
      z-index: 1;
    }

    @keyframes floatIcon {
      0% { opacity: 0; transform: translate(0,0) scale(0.5) rotate(0deg); }
      50% { opacity: 0.6; }
      100% { transform: translate(var(--x), var(--y)) scale(1.1) rotate(360deg); opacity: 0; }
    }

    /* 3D Main Button */
    .glow-button {
      padding: 20px 42px;
      font-size: 32px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;
      position: relative;
      z-index: 10;

      box-shadow:
        0 6px 0 #1e40af,
        0 10px 20px rgba(0,0,0,0.25);

      transition: 0.2s ease;
    }

    .glow-button:hover {
      transform: translateY(-4px);
      box-shadow:
        0 10px 0 #1e40af,
        0 15px 25px rgba(0,0,0,0.25);
    }

    .glow-button:active {
      transform: translateY(3px);
      box-shadow:
        0 3px 0 #1e40af,
        0 8px 15px rgba(0,0,0,0.20);
    }

    /* 3D Drako Tag */
    .gift-tag {
      position: absolute;
      top: 22px;
      right: 22px;

      background: white;
      padding: 12px 24px;
      border-radius: 12px;

      font-weight: 700;
      font-size: 15px;
      color: #2b2b2b;
      letter-spacing: 0.5px;

      border: 2px solid #e5c45d;
      box-shadow:
        0 4px 0 #d4b24f,
        0 6px 12px rgba(0,0,0,0.15);

      transition: 0.2s ease;
      z-index: 10;
    }

    .gift-tag:hover {
      transform: translateY(-3px);
      box-shadow:
        0 6px 0 #d4b24f,
        0 10px 18px rgba(0,0,0,0.18);
    }

    .gift-tag:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #d4b24f,
        0 6px 12px rgba(0,0,0,0.15);
    }

    @media (max-width: 600px) {
      .glow-button {
        font-size: 22px;
        padding: 14px 24px;
      }

      .gift-tag {
        font-size: 11px;
        padding: 8px 14px;
      }

      .icon {
        font-size: 16px;
      }
    }
  </style>

  <script>
    function redirectToLink() {
      window.location.href = ("subject.html");
    }

    document.addEventListener("DOMContentLoaded", () => {
      const icons = ["📚", "📖", "📝", "🎓", "📒"];
      const body = document.body;

      for (let i = 0; i < 30; i++) {
        const icon = document.createElement("div");
        icon.className = "icon";
        icon.textContent = icons[Math.floor(Math.random() * icons.length)];

        const direction = Math.floor(Math.random() * 4);
        let startX, startY, deltaX, deltaY;

        if (direction === 0) {
          startX = Math.random() * 100;
          startY = -10;
          deltaX = (Math.random() - 0.5) * 200;
          deltaY = 120 + Math.random() * 80;
        } else if (direction === 1) {
          startX = Math.random() * 100;
          startY = 110;
          deltaX = (Math.random() - 0.5) * 200;
          deltaY = -120 - Math.random() * 80;
        } else if (direction === 2) {
          startX = -10;
          startY = Math.random() * 100;
          deltaX = 120 + Math.random() * 80;
          deltaY = (Math.random() - 0.5) * 200;
        } else {
          startX = 110;
          startY = Math.random() * 100;
          deltaX = -120 - Math.random() * 80;
          deltaY = (Math.random() - 0.5) * 200;
        }

        icon.style.left = `${startX}vw`;
        icon.style.top = `${startY}vh`;
        icon.style.setProperty('--x', `${deltaX}vw`);
        icon.style.setProperty('--y', `${deltaY}vh`);
        icon.style.animationDuration = (8 + Math.random() * 5) + "s";
        icon.style.fontSize = (20 + Math.random() * 20) + "px";
        body.appendChild(icon);
      }

      const canvas = document.createElement('canvas');
      canvas.id = "stars";
      document.body.appendChild(canvas);
      const ctx = canvas.getContext("2d");

      let width = window.innerWidth;
      let height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;

      let stars = [];

      for (let i = 0; i < 120; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 1.5,
          alpha: Math.random(),
          delta: 0.005 + Math.random() * 0.015
        });
      }

      function animateStars() {
        ctx.clearRect(0, 0, width, height);
        for (let star of stars) {
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,0,0,${star.alpha * 0.4})`;
          ctx.fill();
          star.alpha += star.delta;
          if (star.alpha <= 0 || star.alpha >= 1) star.delta *= -1;
        }
        requestAnimationFrame(animateStars);
      }

      animateStars();

      window.addEventListener('resize', () => {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      });
    });
  </script>
</head>

<body>
  <canvas id="stars"></canvas>

  <!-- Decorative Background -->
  <div class="bg-circle one"></div>
  <div class="bg-circle two"></div>
  <div class="bg-stripes"></div>

  <!-- Drako Tag -->
  <div class="gift-tag">Drako 🍂</div>

  <!-- Main Button -->
  <button class="glow-button" onclick="redirectToLink()">12th Papers KVD</button>
</body>
</html>
