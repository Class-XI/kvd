<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Subjects</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: #fff8cc;
      overflow: hidden;
      position: relative;
    }

    /* Decorative Background */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 200, 0.5);
      filter: blur(40px);
      z-index: 0;
    }

    .bg-circle.one {
      width: 320px;
      height: 320px;
      top: -60px;
      left: -40px;
    }

    .bg-circle.two {
      width: 260px;
      height: 260px;
      bottom: -40px;
      right: -40px;
      background: rgba(255, 230, 150, 0.55);
    }

    .bg-stripes {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(
        135deg,
        rgba(255,255,230,0.4) 0%,
        rgba(255,255,255,0.3) 20%,
        transparent 20%
      );
      background-size: 25px 25px;
      opacity: 0.25;
      pointer-events: none;
      z-index: 0;
    }

    #stars {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
      width: 100%;
      height: 100%;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
    }

    /* 3D Button */
    .glow-button {
      padding: 18px 32px;
      font-size: 26px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 1px;

      box-shadow:
        0 6px 0 #1e40af,
        0 10px 20px rgba(0,0,0,0.25);
      transition: 0.2s ease;
    }

    .glow-button:hover {
      transform: translateY(-4px);
      box-shadow:
        0 10px 0 #1e40af,
        0 15px 25px rgba(0,0,0,0.25);
    }

    .glow-button:active {
      transform: translateY(3px);
      box-shadow:
        0 3px 0 #1e40af,
        0 8px 15px rgba(0,0,0,0.2);
    }

    /* Floating Icons */
    .floating-icon {
      position: absolute;
      width: 30px;
      opacity: 0.7;
      z-index: 0;
      color: #444;
      animation: floatIcon 20s linear infinite;
      filter: drop-shadow(0 0 4px rgba(0,0,0,0.1));
    }

    @keyframes floatIcon {
      0% {
        transform: translateX(-100vw) translateY(100vh) rotate(0deg);
      }
      100% {
        transform: translateX(100vw) translateY(-100vh) rotate(360deg);
      }
    }

    /* Drako Tag */
    .gift-tag {
      position: absolute;
      top: 22px;
      right: 22px;

      background: white;
      padding: 12px 24px;
      border-radius: 12px;

      font-weight: 700;
      font-size: 15px;
      color: #2b2b2b;
      letter-spacing: 0.5px;

      border: 2px solid #e5c45d;
      box-shadow:
        0 4px 0 #d4b24f,
        0 6px 12px rgba(0,0,0,0.15);

      transition: 0.2s ease;
      z-index: 3;
    }

    .gift-tag:hover {
      transform: translateY(-3px);
      box-shadow:
        0 6px 0 #d4b24f,
        0 10px 18px rgba(0,0,0,0.18);
    }

    .gift-tag:active {
      transform: translateY(2px);
      box-shadow:
        0 2px 0 #d4b24f,
        0 6px 12px rgba(0,0,0,0.15);
    }

    @media (max-width: 600px) {
      .glow-button {
        font-size: 20px;
        padding: 14px 24px;
      }
    }
  </style>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Stars
      const canvas = document.getElementById("stars");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const stars = Array.from({ length: 120 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 1.5,
        alpha: Math.random(),
        delta: 0.005 + Math.random() * 0.015,
      }));

      function animateStars() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let s of stars) {
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(0,0,0,${s.alpha * 0.4})`;
          ctx.fill();
          s.alpha += s.delta;
          if (s.alpha <= 0 || s.alpha >= 1) s.delta *= -1;
        }
        requestAnimationFrame(animateStars);
      }
      animateStars();

      // Floating icons
      const icons = ['📘','📕','📝','📚','📖','✏️','🧠','🔬','📐'];
      for (let i = 0; i < 20; i++) {
        const span = document.createElement('span');
        span.className = 'floating-icon';
        span.textContent = icons[Math.floor(Math.random() * icons.length)];
        span.style.top = `${Math.random() * 100}%`;
        span.style.left = `${Math.random() * 100}%`;
        span.style.fontSize = `${16 + Math.random() * 24}px`;
        span.style.animationDuration = `${10 + Math.random() * 20}s`;
        document.body.appendChild(span);
      }
    });

    function goTo(subject) {
      const links = {
        CS: "cs.html",
        Chemistry: "chemistry.html",
        Physics: "physics.html",
        Math: "math.html",
        English: "english.html"
      };
      window.open(links[subject], "_blank");
    }
  </script>
</head>

<body>
  <canvas id="stars"></canvas>

  <!-- Background Effects -->
  <div class="bg-circle one"></div>
  <div class="bg-circle two"></div>
  <div class="bg-stripes"></div>

  <!-- Drako Tag -->
  <div class="gift-tag">Drako 🍂</div>

  <div class="container">
    <button class="glow-button" onclick="goTo('CS')">CS</button>
    <button class="glow-button" onclick="goTo('Chemistry')">Chemistry</button>
    <button class="glow-button" onclick="goTo('Physics')">Physics</button>
    <button class="glow-button" onclick="goTo('Math')">Math</button>
    <button class="glow-button" onclick="goTo('English')">English</button>
  </div>

</body>
</html>
